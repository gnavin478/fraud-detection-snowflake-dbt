version: 2

models:
  - name: stg_transactions
    columns:
      - name: customer_id
        tests:
          - not_null

      - name: amount
        tests:
          - not_null

      - name: transaction_type
        tests:
          - accepted_values:
              arguments:
                values: ['PAYMENT', 'TRANSFER', 'CASH_OUT', 'CASH_IN', 'DEBIT']